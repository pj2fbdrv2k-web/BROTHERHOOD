<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teka Clothing | Onitsha</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-gray-900 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 bg-white text-gray-900 rounded-xl flex items-center justify-center font-black text-xl">
                    TC
                </div>
                <div>
                    <span class="text-xl font-black tracking-tight block">TEKA CLOTHING</span>
                    <span class="text-xs font-bold text-amber-500 uppercase tracking-widest block">EST. 2026 • Onitsha</span>
                </div>
            </div>
            <a href="https://wa.me/2347036924110?text=Hello%20Teka%20Clothing,%20I%20want%20to%20make%20an%20enquiry." target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-sm font-bold flex items-center space-x-2 transition-colors">
                <i class="fa-brands fa-whatsapp text-lg"></i>
                <span>WhatsApp Chat</span>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow py-10 px-4">
        <div class="max-w-3xl mx-auto text-center mb-10">
            <span class="bg-gray-200 text-gray-800 text-xs font-extrabold px-3 py-1 rounded-full uppercase tracking-widest inline-block mb-3">Official Storefront</span>
            <h1 class="text-3xl sm:text-4xl font-black tracking-tight mb-3">Premium Apparel & Waybill Dispatch</h1>
            <p class="text-gray-600 text-sm sm:text-base">Top-quality polos, trousers, and shorts available for fast dispatch straight from our Onitsha hub.</p>
        </div>

        <div id="product-grid" class="max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white py-8 px-4 text-center text-xs text-gray-400">
        <p>&copy; 2026 Teka Clothing Co. Onitsha, Anambra State, Nigeria.</p>
    </footer>

    <!-- Script -->
    <script>
        const products = [
            {
                id: 1,
                name: "Classic Italian Cotton Polo",
                category: "Polos",
                price: 14500,
                image: "https://images.unsplash.com/photo-1581655353564-df123a1eb820?auto=format&fit=crop&q=80&w=800",
                desc: "Premium breathable fabric, tailored fit."
            },
            {
                id: 2,
                name: "Executive Chino Trousers",
                category: "Trousers",
                price: 22000,
                image: "https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?auto=format&fit=crop&q=80&w=800",
                desc: "Smooth finish cotton blend trouser."
            },
            {
                id: 3,
                name: "Urban Cargo Shorts",
                category: "Shorts",
                price: 12500,
                image: "https://images.unsplash.com/photo-1591195853828-11db59a44f6b?auto=format&fit=crop&q=80&w=800",
                desc: "Multi-pocket rugged cargo shorts."
            }
        ];

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = products.map(p => `
                <div class="bg-white rounded-2xl border border-gray-200 overflow-hidden shadow-sm flex flex-col justify-between">
                    <div>
                        <div class="aspect-square bg-gray-100 overflow-hidden">
                            <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover">
                        </div>
                        <div class="p-4">
                            <span class="text-[10px] font-extrabold uppercase bg-gray-100 text-gray-700 px-2 py-0.5 rounded">${p.category}</span>
                            <h3 class="font-bold text-gray-900 text-base mt-1">${p.name}</h3>
                            <p class="text-xs text-gray-500 mt-1">${p.desc}</p>
                            <div class="text-lg font-black text-blue-600 mt-3">₦${p.price.toLocaleString()}</div>
                        </div>
                    </div>
                    <div class="p-4 pt-0">
                        <a href="https://wa.me/2347036924110?text=Hello%20Teka%20Clothing,%20I%20want%20to%20order%20${encodeURIComponent(p.name)}%20for%20₦${p.price.toLocaleString()}" target="_blank" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-xs flex items-center justify-center space-x-2">
                            <i class="fa-brands fa-whatsapp text-base"></i>
                            <span>Order via WhatsApp</span>
                        </a>
                    </div>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', renderProducts);
    </script>
</body>
</html>
